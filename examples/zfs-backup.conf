# /etc/zfs-backup.conf - optional overrides for zfs-snapshot.sh and
# zfs-b2-upload.sh. Defaults match the setup guide; uncomment to change.

# Backup dataset and its mountpoint.
#DS=tank/backup
#SRC_MOUNT=/backup

# rclone destination (remote:path) and upload state directory.
#REMOTE=b2:zfs-backup
#STATE_DIR=/var/lib/zfs-backup

# Dataset key used by `--drill` to decrypt the restored dataset.
#KEYFILE=/etc/zfs/zfs.key

# Maximum deltas in a chain; the next upload sends a fresh full base.
#KEEP_DELTAS=8

# Snapshot retention.
#DAILY_KEEP=14
#WEEKLY_KEEP=8
#MONTHLY_KEEP=12
#YEARLY_KEEP=3

# Scratch dataset used by `--drill`; destroyed afterwards.
#DRILL_DS=tank/drill
#DRILL_MOUNT=/tank/drill
